# Nginx Configuration for QMF Static Server
# Domain: ui.quizzman.com
# Purpose: Serve QMF framework and shared assets
# Version: 2.0.0

server {
    listen 80;
    server_name ui.quizzman.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ui.quizzman.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/quizzman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizzman.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Document root - QMF directory
    root /opt/quizzman-backup/quizzman-new/share-ui/qmf;
    index index.html;
    
    # ==================== COMPRESSION ====================
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    
    # Brotli (nếu có module)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/javascript;
    
    # ==================== CACHING STRATEGY (CRITICAL) ====================
    
    # 1. STABLE ENTRIES: qmf.js, qmf.css - SHORT CACHE
    # Đây là shim files, cần refresh nhanh khi deploy mới
    location ~* ^/qmf/dist/qmf\.(js|css)$ {
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        try_files $uri =404;
    }
    
    # 2. MANIFEST: manifest.json - SHORT CACHE
    location ~* ^/qmf/dist/manifest\.json$ {
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Content-Type "application/json";
        try_files $uri =404;
    }
    
    # 3. IMMUTABLE HASHED FILES: qmf.{hash}.js/css - LONG CACHE (1 YEAR)
    # Content-hash trong filename = immutable, cache forever
    location ~* ^/qmf/dist/qmf\.[a-f0-9]{8}\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        expires max;
        try_files $uri =404;
    }
    
    # 4. VERSIONED PATH: /qmf/v2.0.0/dist/* - LONG CACHE
    # Production pin version
    location ~* ^/qmf/v[0-9]+\.[0-9]+\.[0-9]+/dist/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        expires max;
        
        # Rewrite to actual dist path
        rewrite ^/qmf/v[0-9]+\.[0-9]+\.[0-9]+/dist/(.*)$ /qmf/dist/$1 last;
    }
    
    # ==================== QMF MAIN LOCATION ====================
    
    # QMF Dist directory (built assets)
    location /qmf/dist/ {
        alias /opt/quizzman-backup/quizzman-new/share-ui/qmf/dist/;
        
        # Default cache for other files in dist
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        
        # Correct MIME types
        types {
            text/javascript js mjs;
            text/css css;
            application/json json;
        }
        
        try_files $uri =404;
    }
    
    # QMF Assets directory
    location /qmf/assets/ {
        alias /opt/quizzman-backup/quizzman-new/share-ui/qmf/assets/;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    
    # Lucide icons - special handling (1 YEAR cache - static assets)
    location /qmf/assets/icons/lucide-source/icons/ {
        alias /opt/quizzman-backup/quizzman-new/share-ui/qmf/assets/icons/lucide-source/icons/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Content-Type "image/svg+xml";
        expires max;
    }
    
    # Logo images (1 YEAR cache - static assets, versioned via ?v= if needed)
    location /qmf/assets/logo/ {
        alias /opt/quizzman-backup/quizzman-new/share-ui/qmf/assets/logo/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        expires max;
    }
    
    # ==================== SECURITY HEADERS ====================
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.quizzman.com; style-src 'self' 'unsafe-inline' https://*.quizzman.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://*.quizzman.com wss://*.quizzman.com; frame-ancestors 'self' https://*.quizzman.com;";
    
    # Other security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ==================== CORS for ESM modules ====================
    
    # Preflight requests
    location ~* \.(js|css)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }
        
        add_header Access-Control-Allow-Origin "*";
    }
    
    # ==================== UTILITY ENDPOINTS ====================
    
    # Health check
    location = /health {
        return 200 '{"status":"ok","service":"qmf","version":"2.0.0"}';
        add_header Content-Type application/json;
    }
    
    # Version info
    location = /qmf/version {
        return 200 '{"version":"2.0.0","domain":"ui.quizzman.com"}';
        add_header Content-Type application/json;
    }
    
    # ==================== SECURITY BLOCKS ====================
    
    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Block source code and sensitive files
    location ~* ^/qmf/(kernel|services|plugins|scripts|node_modules)/ {
        deny all;
        return 404;
    }
    
    location ~ (package\.json|package-lock\.json|\.md|\.txt|\.log)$ {
        deny all;
        return 404;
    }
    
    # ==================== ERROR PAGES ====================
    
    error_page 404 @404_json;
    error_page 500 502 503 504 @50x_json;
    
    location @404_json {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Resource not found"}';
    }
    
    location @50x_json {
        default_type application/json;
        return 500 '{"error":"server_error","message":"Internal server error"}';
    }
    
    # ==================== LOGGING ====================
    
    access_log /var/log/nginx/ui.quizzman.com.access.log;
    error_log /var/log/nginx/ui.quizzman.com.error.log;
}
