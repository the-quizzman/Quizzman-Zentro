<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dmca-site-verification" content="ejRCNEZ2NzI1YUdwNllSZk80dlpNQT090">
    <title>QuizzMan Mail - Login</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://ui.quizzman.com/qmf/assets/logo/webmail/favicon.ico" type="image/x-icon">
    
    <!-- QMF Auth Scaffolding -->
    <link rel="stylesheet" href="https://ui.quizzman.com/qmf/dist/qmf-auth.css">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="qmf-auth-body qmf-auth-body--webmail">
    <div class="qmf-auth-card">
        <!-- Auth Header with Logo -->
        <div class="qmf-auth-header">
            <div class="qmf-auth-logo-wrapper">
                <img src="https://ui.quizzman.com/qmf/assets/logo/webmail/webmail-logo-64.png" 
                     alt="QuizzMan Mail" 
                     class="qmf-brand-logo">
            </div>
            <h1 class="qmf-brand-title">QuizzMan Mail</h1>
            <p class="qmf-brand-subtitle">Secure email for education</p>
        </div>

        <!-- Auth Content -->
        <div class="qmf-auth-content">
            <h2 class="qmf-auth-title">Đăng nhập</h2>
            
            <!-- Error Message (hidden by default) -->
            <div class="qmf-auth-message qmf-auth-message--error" id="errorMessage" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Email hoặc mật khẩu không đúng</span>
            </div>

            <form id="loginForm">
                <div class="qmf-auth-form-group">
                    <label class="qmf-auth-label" for="email">Email</label>
                    <div class="qmf-auth-input-wrapper">
                        <i class="fas fa-envelope qmf-auth-input-icon"></i>
                        <input type="email" 
                               id="email" 
                               class="qmf-auth-input" 
                               placeholder="your@email.com"
                               required
                               autocomplete="email">
                    </div>
                </div>

                <div class="qmf-auth-form-group">
                    <label class="qmf-auth-label" for="password">Mật khẩu</label>
                    <div class="qmf-auth-input-wrapper">
                        <i class="fas fa-lock qmf-auth-input-icon"></i>
                        <input type="password" 
                               id="password" 
                               class="qmf-auth-input" 
                               placeholder="••••••••"
                               required
                               autocomplete="current-password">
                    </div>
                </div>

                <div class="qmf-auth-form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="qmf-auth-checkbox-wrapper">
                        <input type="checkbox" id="remember" class="qmf-auth-checkbox">
                        <label for="remember" class="qmf-auth-checkbox-label">Ghi nhớ đăng nhập</label>
                    </div>
                    <a href="/forgot-password" class="qmf-auth-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="qmf-auth-btn qmf-auth-btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Đăng nhập
                </button>
            </form>

            <div class="qmf-auth-divider">
                <span>hoặc</span>
            </div>

            <div class="qmf-auth-social-grid">
                <button class="qmf-auth-social-btn" title="Đăng nhập với Google">
                    <i class="fab fa-google"></i>
                </button>
                <button class="qmf-auth-social-btn" title="Đăng nhập với Microsoft">
                    <i class="fab fa-microsoft"></i>
                </button>
                <button class="qmf-auth-social-btn" title="Đăng nhập với GitHub">
                    <i class="fab fa-github"></i>
                </button>
            </div>

            <p class="qmf-auth-text">
                Chưa có tài khoản? <a href="/register" class="qmf-auth-link">Đăng ký ngay</a>
            </p>
        </div>

        <!-- Auth Footer -->
        <div class="qmf-auth-footer">
            <p class="qmf-auth-footer-text">
                © 2025 QuizzMan. <a href="/privacy" class="qmf-auth-link">Privacy</a> · <a href="/terms" class="qmf-auth-link">Terms</a>
            </p>
        </div>
    </div>

    <script>
        // Simple form handling example
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            // Show loading state
            btn.classList.add('qmf-auth-loading');
            btn.innerHTML = '<span class="qmf-auth-spinner"></span> Đang xử lý...';
            errorDiv.style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // Replace with actual API call
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    window.location.href = '/inbox';
                } else {
                    throw new Error('Login failed');
                }
            } catch (error) {
                errorDiv.style.display = 'flex';
                btn.classList.remove('qmf-auth-loading');
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập';
            }
        });
    </script>
</body>
</html>
