<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="theme-color" content="#3b82f6">
    
    <title>{{APP_TITLE}}</title>
    
    <!-- Preconnect to QMF share server -->
    <link rel="preconnect" href="https://share.quizzman.com:9999">
    <link rel="dns-prefetch" href="https://share.quizzman.com:9999">
    
    <!-- QMF Theme CSS -->
    <link rel="stylesheet" href="https://share.quizzman.com:9999/theme/tokens.css">
    <link rel="stylesheet" href="https://share.quizzman.com:9999/theme/typography.css">
    <link rel="stylesheet" href="https://share.quizzman.com:9999/theme/motion.css">
    
    <!-- App-specific CSS (optional) -->
    <!-- <link rel="stylesheet" href="/css/app.css"> -->
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{APP_TITLE}}">
    <meta property="og:description" content="">
    <meta property="og:image" content="/og-image.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <style>
        /* Critical CSS - Inline for faster first paint */
        :root {
            --qmf-header-height: 64px;
            --qmf-sidebar-width: 280px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
        }
        
        body {
            font-family: var(--qmf-font-family, system-ui, -apple-system, sans-serif);
            background: var(--qmf-color-bg, #ffffff);
            color: var(--qmf-color-text, #1f2937);
            line-height: 1.5;
        }
        
        #app {
            min-height: 100vh;
        }
        
        /* Initial loading state */
        .qmf-loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--qmf-color-bg, #ffffff);
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        .qmf-loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        .qmf-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--qmf-color-primary, #3b82f6);
            border-radius: 50%;
            animation: qmf-spin 0.8s linear infinite;
        }
        
        .qmf-loading-text {
            margin-top: 1rem;
            color: var(--qmf-color-text-muted, #6b7280);
            font-size: 0.875rem;
        }
        
        @keyframes qmf-spin {
            to { transform: rotate(360deg); }
        }
        
        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background: var(--qmf-color-bg-dark, #111827);
                color: var(--qmf-color-text-dark, #f9fafb);
            }
            
            .qmf-loading-screen {
                background: var(--qmf-color-bg-dark, #111827);
            }
            
            .qmf-loading-spinner {
                border-color: #374151;
                border-top-color: var(--qmf-color-primary, #60a5fa);
            }
        }
        
        /* No JS fallback */
        .no-js .qmf-loading-screen {
            display: none;
        }
    </style>
</head>
<body class="no-js">
    <script>document.body.classList.remove('no-js');</script>
    
    <!-- Initial Loading Screen -->
    <div id="qmf-loading" class="qmf-loading-screen">
        <div class="qmf-loading-spinner"></div>
        <div class="qmf-loading-text">Loading...</div>
    </div>
    
    <!-- App Root -->
    <div id="app">
        <!-- App shell will be mounted here -->
        
        <!-- No-JS Fallback Content -->
        <noscript>
            <div style="padding: 2rem; text-align: center;">
                <h1>JavaScript Required</h1>
                <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
            </div>
        </noscript>
    </div>
    
    <!-- QMF Framework -->
    <script type="module">
        // Import QMF and app config
        import QMF from 'https://share.quizzman.com:9999/public-api.js';
        
        // TODO: Import your app-specific config
        // import appConfig from 'https://share.quizzman.com:9999/apps/dict.js';
        
        // Or define inline config:
        const appConfig = {
            app: {
                id: 'my-app',
                name: 'My Application',
                version: '1.0.0'
            },
            branding: {
                logo: '/logo.svg',
                color: '#3b82f6',
                theme: 'system' // 'light' | 'dark' | 'system'
            },
            header: {
                enabled: true,
                showMainLogo: true,
                showSearch: true,
                navItems: []
            },
            sidebar: {
                enabled: true,
                collapsible: true,
                items: []
            },
            footer: {
                enabled: true
            },
            routes: [],
            features: {
                commandPalette: true,
                notifications: true
            }
        };
        
        // Initialize QMF
        const app = await QMF.init(appConfig);
        
        // Hide loading screen
        const loadingScreen = document.getElementById('qmf-loading');
        if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(() => loadingScreen.remove(), 300);
        }
        
        // Log initialization
        console.log(`%c${appConfig.app.name} v${appConfig.app.version}`, 
            'color: #3b82f6; font-weight: bold; font-size: 14px;');
        console.log('%cPowered by QMF', 'color: #6b7280; font-size: 12px;');
    </script>
    
    <!-- App-specific scripts (optional) -->
    <!-- <script type="module" src="/js/app.js"></script> -->
</body>
</html>
