<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Quizzman</title>
    <style>
        :root {
            --qmf-primary: #3b82f6;
            --qmf-text: #1f2937;
            --qmf-text-muted: #6b7280;
            --qmf-bg: #ffffff;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --qmf-primary: #60a5fa;
                --qmf-text: #f9fafb;
                --qmf-text-muted: #9ca3af;
                --qmf-bg: #111827;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--qmf-bg);
            color: var(--qmf-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--qmf-primary);
            line-height: 1;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .error-message {
            color: var(--qmf-text-muted);
            margin-bottom: 2rem;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--qmf-primary);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--qmf-text);
            border: 1px solid currentColor;
        }
        
        .btn-secondary:hover {
            background: rgba(128, 128, 128, 0.1);
        }
        
        .logo {
            margin-bottom: 2rem;
        }
        
        .logo svg {
            width: 48px;
            height: 48px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="12" fill="var(--qmf-primary)"/>
                <path d="M16 20C16 17.7909 17.7909 16 20 16H28C30.2091 16 32 17.7909 32 20V28C32 30.2091 30.2091 32 28 32H20C17.7909 32 16 30.2091 16 28V20Z" stroke="white" stroke-width="2"/>
                <path d="M24 22V26M24 28V28.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>
</body>
</html>
