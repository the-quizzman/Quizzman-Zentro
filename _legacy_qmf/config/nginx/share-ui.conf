# QMF Share-UI Nginx Configuration
# Server running on port 9999 with SSL
# Place this file in /etc/nginx/sites-available/share-ui.conf
# Then: ln -s /etc/nginx/sites-available/share-ui.conf /etc/nginx/sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=qmf_limit:10m rate=100r/s;

# Upstream for static files (optional: add more servers for load balancing)
upstream qmf_static {
    server 127.0.0.1:9999;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name share.quizzman.com *.quizzman.com;
    
    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 9999 ssl http2;
    listen [::]:9999 ssl http2;
    
    server_name share.quizzman.com;
    
    # SSL Certificate paths
    # Option 1: Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/quizzman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizzman.com/privkey.pem;
    
    # Option 2: Self-signed (for development)
    # ssl_certificate /etc/nginx/ssl/qmf-selfsigned.crt;
    # ssl_certificate_key /etc/nginx/ssl/qmf-selfsigned.key;
    
    # SSL Configuration (Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL Session
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Document root
    root /opt/quizzman-backup/quizzman-new/share-ui/qmf;
    index public-api.js;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # CORS Headers for cross-subdomain access
    add_header Access-Control-Allow-Origin "https://*.quizzman.com" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
    add_header Access-Control-Max-Age "86400" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    
    # Brotli Compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/javascript application/javascript application/json;
    
    # Rate limiting
    limit_req zone=qmf_limit burst=50 nodelay;
    
    # Logging
    access_log /var/log/nginx/qmf-access.log combined;
    error_log /var/log/nginx/qmf-error.log warn;
    
    # JavaScript files (ES Modules)
    location ~* \.js$ {
        types { application/javascript js; }
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        
        # CORS for JS modules
        add_header Access-Control-Allow-Origin "https://*.quizzman.com" always;
    }
    
    # CSS files
    location ~* \.css$ {
        types { text/css css; }
        add_header Content-Type "text/css; charset=utf-8";
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    
    # Version manifest (short cache for version checking)
    location = /version-manifest.json {
        add_header Cache-Control "public, max-age=300";
        expires 5m;
    }
    
    # Assets (images, fonts)
    location /assets/ {
        alias /opt/quizzman-backup/quizzman-new/share-ui/qmf/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        
        # Additional image types
        location ~* \.(ico|gif|jpg|jpeg|png|webp|svg)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Font files
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }
    
    # Kernel modules
    location /kernel/ {
        try_files $uri =404;
    }
    
    # Platform modules
    location /platform/ {
        try_files $uri =404;
    }
    
    # Layout modules
    location /layout/ {
        try_files $uri =404;
    }
    
    # Navigation modules
    location /navigation/ {
        try_files $uri =404;
    }
    
    # UI components
    location /ui/ {
        try_files $uri =404;
    }
    
    # Feedback components
    location /feedback/ {
        try_files $uri =404;
    }
    
    # Theme files
    location /theme/ {
        try_files $uri =404;
    }
    
    # Plugins
    location /plugins/ {
        try_files $uri =404;
    }
    
    # App configs
    location /apps/ {
        try_files $uri =404;
    }
    
    # Main entry point
    location = / {
        try_files /public-api.js =404;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }
    
    # Block access to hidden files and scripts
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(sh|py|rb|php)$ {
        deny all;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
        root /opt/quizzman-backup/quizzman-new/share-ui/qmf/errors;
    }
    
    location = /50x.html {
        internal;
        root /opt/quizzman-backup/quizzman-new/share-ui/qmf/errors;
    }
}

# Subdomain configurations (all point to QMF for shared assets)
# Dict subdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name dict.quizzman.com;
    
    ssl_certificate /etc/letsencrypt/live/quizzman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizzman.com/privkey.pem;
    
    # Include shared SSL config
    include /etc/nginx/snippets/ssl-params.conf;
    
    root /var/www/dict.quizzman.com;
    
    # Proxy QMF assets from share-ui
    location /qmf/ {
        proxy_pass https://share.quizzman.com:9999/;
        proxy_ssl_verify off;
        proxy_set_header Host share.quizzman.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1y;
    }
    
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

