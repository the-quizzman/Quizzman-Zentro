<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{TITLE}}</title>
  <!--[if mso]>
  <style type="text/css">
    table {border-collapse: collapse;}
    .button-link {padding: 14px 30px !important;}
  </style>
  <![endif]-->
  <style>
    /* Inlined from themes/default.css */
    {{CSS}}
  </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7fa; -webkit-font-smoothing: antialiased;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f7fa;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);">
          
          <!-- Header -->
          {{HEADER}}

          <!-- Content -->
          <tr>
            <td style="padding: 0 40px 40px 40px;">
              {{CONTENT}}
            </td>
          </tr>

          <!-- Footer -->
          {{FOOTER}}

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
