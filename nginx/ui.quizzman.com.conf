# Nginx Configuration for QMF Static Server (Mobile-Optimized)
# Domain: ui.quizzman.com
# Updated: 2026-04-01 — Phase 2/3 mobile & SEO optimizations

server {
    listen 80;
    server_name ui.quizzman.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ui.quizzman.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/ui.quizzman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.quizzman.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Document root - QMF directory
    root /opt;
    index index.html;

    # ==================== COMPRESSION ====================
    # Aggressive gzip — critical for mobile 3G/4G
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2
        application/wasm;

    # Serve pre-compressed .gz files if available
    gzip_static on;

    # ==================== SECURITY HEADERS ====================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== LANDING PAGE ====================
    # Homepage is the site root (not /qmf/)
    location = / {
        rewrite ^ /qmf/index.html break;
    }

    location = /qmf {
        return 301 /;
    }

    location = /qmf/ {
        return 301 /;
    }

    location = /qmf/index.html {
        return 301 /;
    }

    # ==================== INDEXNOW KEY ====================
    location = /6b6e1e42e90ed0a0c50ac454aaf1e709.txt {
        default_type text/plain;
        alias /opt/QMF/6b6e1e42e90ed0a0c50ac454aaf1e709.txt;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /qmf/6b6e1e42e90ed0a0c50ac454aaf1e709.txt {
        default_type text/plain;
        alias /opt/QMF/6b6e1e42e90ed0a0c50ac454aaf1e709.txt;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

# ==================== AI / SEARCH DISCOVERY ====================
    location = /robots.txt {
        default_type text/plain;
        alias /opt/QMF/robots.txt;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /llms.txt {
        default_type text/plain;
        alias /opt/QMF/llms.txt;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /qmf/robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /qmf/robots.txt =404;
    }

    location = /qmf/llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /qmf/llms.txt =404;
    }

    location = /qmf/sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /qmf/sitemap.xml =404;
    }

    # ==================== VERDACCIO REGISTRY ====================
    location /registry/ {
        proxy_pass http://127.0.0.1:4873/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 50m;
    }

    # ==================== HEALTH & VERSION ====================
    location = /health {
        return 200 '{"status":"ok","service":"qmf","version":"3.0.0"}';
        add_header Content-Type application/json;
    }

    location = /qmf/version {
        return 200 '{"version":"3.0.0"}';
        add_header Content-Type application/json;
    }

    # ==================== QMF DIST — STABLE ENTRIES ====================
    # Entry files: short cache (1 min) so updates propagate fast
    # Include named CSS entries that are NOT content-hashed (else CF caches 404 for 1y)
    location ~ ^/qmf/dist/(qmf\.(js|css|min\.js)|qmf-friends-preload\.css|tokens\.css|ui\.css|manifest\.json)$ {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ==================== QMF DIST — HASHED/VERSIONED FILES ====================
    # All other dist files: immutable 1-year cache (hashed filenames)
    location /qmf/dist/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    # ==================== QMF V3 — STATIC ASSETS ====================
    # Package dist files: aggressive cache with revalidation
    location /qmf/v3/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ==================== QMF UI COMPONENTS ====================
    location /qmf/ui/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    # ==================== FONT FILES — LONG CACHE ====================
    location ~* \.(woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ==================== IMAGE FILES — LONG CACHE ====================
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ==================== LEGACY V2 ====================
    location /qmf/v2/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ==================== QMF ASSETS ====================
    location /qmf/assets/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ==================== DOCS ====================
    # Old docs shell → site root (homepage is the docs portal)
    location = /qmf/docs {
        return 301 /;
    }

    location = /qmf/docs.html {
        return 301 /;
    }

    # Markdown viewer shell
    location = /qmf/view {
        rewrite ^ /qmf/view.html last;
    }

    location = /qmf/view.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Story Viewer — Markdown → Report → Story (reusable package)
    location = /qmf/story {
        rewrite ^ /qmf/story.html last;
    }

    location = /qmf/story.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/qmf/docs/(.+)\.html$ {
        return 301 /qmf/docs/$1;
    }

    location ~ /qmf/docs/.*\.internal\.(md|html)$ {
        deny all;
    }

    # Browser (Accept: text/html) → rendered viewer; ?raw=1 or non-HTML → plain .md
    location ~ ^/qmf/docs/.+\.md$ {
        set $qmf_md_viewer 0;
        if ($http_accept ~* text/html) {
            set $qmf_md_viewer 1;
        }
        if ($arg_raw = "1") {
            set $qmf_md_viewer 0;
        }
        if ($qmf_md_viewer = 1) {
            rewrite ^ /qmf/view.html last;
        }

        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location /qmf/docs/ {
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            text/markdown md;
            text/plain txt;
            application/json json;
            text/html html;
        }
        default_type text/markdown;
        try_files $uri $uri/ =404;
    }

    # ==================== QMF 4.0 LIVE DEMO ====================
    location /qmf/v4-demo/ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            text/html html;
            text/javascript js mjs;
            application/json json;
        }
        default_type text/plain;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /qmf/packages/ {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            text/javascript js mjs;
            application/json json;
        }
        default_type text/javascript;
        try_files $uri =404;
    }

    # ==================== QMF 4.0 SCHEMAS ====================
    location /qmf/schemas/ {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/schema+json;
        types { application/json json; application/schema+json json; }
        try_files $uri $uri/ =404;
    }

    # ==================== SECURITY BLOCKS ====================
    location ~ ^/qmf/(kernel|services|plugins|scripts|node_modules|_src)/ {
        deny all;
    }

    location ~ \.map$ {
        deny all;
    }

    location ~ \.(sh)$ {
        deny all;
    }

    # ==================== LOGGING ====================
    access_log /var/log/nginx/ui.quizzman.com.access.log;
    error_log /var/log/nginx/ui.quizzman.com.error.log;
}
